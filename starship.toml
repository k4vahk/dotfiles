# ~/.config/starship.toml

# 1. FORMATO GENERAL
# Define el orden en que aparecen los elementos
format = """
[╭─](bold blue) $os$username$hostname$directory$git_branch$git_status$python$package
[╰─](bold blue) $character"""

# 2. SISTEMA OPERATIVO (Icono de Arch)
[os]
disabled = false
style = "bold blue"

[os.symbols]
Arch = " "
Linux = " "

# 3. DIRECTORIO (Tu ubicación actual)
[directory]
style = "bold cyan"
read_only = " "
truncation_length = 3        # Acorta si la ruta es muy larga
truncation_symbol = "…/"     # Símbolo de acortado
format = "[$path]($style)[$read_only]($read_only_style) "

# 4. USUARIO (Modo Root)
# Solo se muestra si eres root
[username]
style_root = "bold red"
style_user = "bold yellow"
show_always = false          # False = solo muestra si eres root o SSH
format = "[ root]($style) " # Icono de privilegio

# 5. HOSTNAME (Nombre de la máquina)
# Útil en máquinas virtuales y SSH
[hostname]
ssh_only = false             # Cambia a true si no quieres verlo siempre
style = "bold purple"
format = "[$hostname]($style) "

# 6. GIT (Ramas y estado)
[git_branch]
symbol = " "
style = "bold purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold red"
format = "([$all_status$ahead_behind]($style) )"

# 7. LENGUAJES (Python, etc)
# Solo aparece si estás en una carpeta con archivos .py
[python]
symbol = " "
style = "bold yellow"
format = "[${symbol}${version}]($style) "

# 8. EL CARÁCTER DEL PROMPT (Status)
# Cambia de color según éxito o error
[character]
success_symbol = "[➜](bold green)"
error_symbol = "[✗](bold red)"
